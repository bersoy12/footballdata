services:
  core:
    container_name: core
    build: 
      context: ./docker/core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/core-app:/app
    env_file:
      - scripts/core-app/.env
    environment:
      - DOCKER_ENV=1
      - DISPLAY=:99
    shm_size: '2gb'
    privileged: true
    cap_add:
      - SYS_ADMIN
    depends_on:
      - postgres-football

  postgres-football:
    # image: postgres
    build:
      context: ./docker/postgres-football
      dockerfile: Dockerfile
    container_name: footballdb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: football
    ports:
      - "5435:5432"
    volumes:
      - footballdata:/var/lib/postgresql/data
      - ./scripts/postgres:/scripts

  n8n:
    # image: n8nio/n8n:latest
    container_name: n8n
    build:
      context: ./docker/n8n
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres-football


  pgadmin4:
    build:
      context: ./docker/pgadmin4
      dockerfile: Dockerfile
    container_name: pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "80:80"
    volumes:
      - pgadmin4:/var/lib/pgadmin
      - ./docker/pgadmin4/servers.json:/pgadmin4/servers.json
  
  streamlit:
    container_name: streamlit
    build:
      context: ./docker/streamlit
      dockerfile: Dockerfile
    env_file:
      - scripts/streamlit-app/.env
    environment:
      - WATCHDOG_TIMEOUT=60
      - STREAMLIT_SERVER_WATCH_DIRS=true
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
    ports:
      - "8501:8501"
    volumes:
      - ./scripts/streamlit-app:/app/streamlit-app

  postgres-superset:
    build:
      context: ./docker/postgres-superset
      dockerfile: Dockerfile
    container_name: supersetdb
    env_file:
      - .env
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: supersetdb
    volumes:
      - superset_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  
  superset:
    container_name: superset
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    volumes:
      - ./docker/superset/superset_config.py:/app/superset_config.py
    depends_on:
      - postgres-superset


volumes:
  footballdata:
  pgadmin4:
  superset_data:
  n8n_data:
